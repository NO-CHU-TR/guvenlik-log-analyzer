<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Güvenlik Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; color: #2c3e50; }
    h1 { border-bottom: 3px solid #3498db; padding-bottom: 10px; }
    .ust { margin: 10px 0; display: flex; align-items: center; gap: 12px; }
    .kart-satir { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin: 20px 0; }
    .kart { padding: 18px; border-radius: 8px; color: white; text-align: center; font-weight: bold; }
    .kart .sayi { font-size: 30px; margin-top: 6px; }
    .kutu { background: white; border-radius: 8px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grafik-kutu { position: relative; height: 280px; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #34495e; color: white; padding: 8px; text-align: left; }
    td { padding: 8px; border-bottom: 1px solid #eee; }
    .btn { padding: 10px 18px; background: #27ae60; color: white; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
    .btn:disabled { background: #95a5a6; cursor: wait; }
    .ai-kart { background: #fafafa; border-left: 4px solid #8e44ad; padding: 12px; margin-bottom: 10px; border-radius: 6px; }
    .muted { color: #7f8c8d; font-style: italic; }
</style>
</head>
<body>
    <h1>🔒 Güvenlik Log Analizi Dashboard</h1>

    <div class="ust">
        <button id="taraBtn" class="btn" onclick="taraCalistir()">▶ Çalıştır: Tara + AI Yorumla</button>
        <span id="durum" class="muted">Yükleniyor...</span>
    </div>

    <div class="kart-satir">
        <div class="kart" style="background:#34495e">TOPLAM<div class="sayi" id="toplam">-</div></div>
        <div class="kart" style="background:#e74c3c">KRİTİK<div class="sayi" id="kritik">-</div></div>
        <div class="kart" style="background:#e67e22">YÜKSEK<div class="sayi" id="yuksek">-</div></div>
        <div class="kart" style="background:#f39c12">ORTA<div class="sayi" id="orta">-</div></div>
        <div class="kart" style="background:#27ae60">DÜŞÜK<div class="sayi" id="dusuk">-</div></div>
        <div class="kart" style="background:#8e44ad">ORT. SKOR<div class="sayi" id="ortskor">-</div></div>
    </div>

    <div class="grid2">
        <div class="kutu">
            <h3>Seviye Dağılımı</h3>
            <div class="grafik-kutu"><canvas id="pasta"></canvas></div>
        </div>
        <div class="kutu">
            <h3>Trend (son taramalar)</h3>
            <div class="grafik-kutu"><canvas id="trend"></canvas></div>
        </div>
    </div>

    <div class="kutu" id="aiBolum" style="display:none;">
        <h3>🤖 AI Yorumları</h3>
        <div id="aiSonuc"></div>
    </div>

    <div class="kutu">
        <h3>🔴 Kritik Olaylar</h3>
        <div id="kritikListe" class="muted">Yükleniyor...</div>
    </div>

    <div class="kutu">
        <h3>🗂️ Tarama Geçmişi</h3>
        <table>
            <thead>
                <tr><th>#</th><th>Tarih</th><th>Toplam</th><th>Kritik</th><th>Yüksek</th><th>Orta</th><th>Düşük</th><th>Ort. Skor</th></tr>
            </thead>
            <tbody id="gecmisTablo"></tbody>
        </table>
    </div>

<script>
let pastaGrafik = null;
let trendGrafik = null;

async function getir(url, secenek) {
    const cevap = await fetch(url, secenek);
    if (!cevap.ok) throw new Error(url + " → HTTP " + cevap.status);
    return cevap.json();
}

function yaz(id, metin) {
    document.getElementById(id).textContent = metin;
}

function tarihKisalt(iso) {
    return iso ? iso.replace("T", " ").slice(0, 19) : "-";
}

async function sonTaramaYukle() {
    try {
        const v = await getir("/api/son-tarama");
        if (!v.var) {
            yaz("durum", "Henüz tarama yapılmamış.");
            return;
        }
        yaz("toplam", v.toplam);
        yaz("kritik", v.kritik);
        yaz("yuksek", v.yuksek);
        yaz("orta", v.orta);
        yaz("dusuk", v.dusuk);
        yaz("ortskor", (v.ort_skor ?? 0).toFixed(2));
        yaz("durum", "Son tarama: " + tarihKisalt(v.tarih));

        if (pastaGrafik) pastaGrafik.destroy();
        pastaGrafik = new Chart(document.getElementById("pasta"), {
            type: "doughnut",
            data: {
                labels: ["Kritik", "Yüksek", "Orta", "Düşük"],
                datasets: [{
                    data: [v.kritik, v.yuksek, v.orta, v.dusuk],
                    backgroundColor: ["#e74c3c", "#e67e22", "#f39c12", "#27ae60"]
                }]
            },
            options: { maintainAspectRatio: false }
        });
    } catch (h) {
        yaz("durum", "Son tarama alınamadı: " + h.message);
    }
}

async function gecmisYukle() {
    try {
        const v = await getir("/api/gecmis?limit=20");
        const tbody = document.getElementById("gecmisTablo");
        tbody.innerHTML = "";

        v.taramalar.forEach(t => {
            const tr = document.createElement("tr");
            [t.id, tarihKisalt(t.tarih), t.toplam, t.kritik, t.yuksek, t.orta, t.dusuk,
             (t.ort_skor ?? 0).toFixed(2)].forEach(d => {
                const td = document.createElement("td");
                td.textContent = d ?? "-";
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });

        const sirali = [...v.taramalar].reverse();
        if (trendGrafik) trendGrafik.destroy();
        trendGrafik = new Chart(document.getElementById("trend"), {
            type: "line",
            data: {
                labels: sirali.map(t => tarihKisalt(t.tarih).slice(5, 16)),
                datasets: [
                    { label: "Toplam", data: sirali.map(t => t.toplam), borderColor: "#34495e" },
                    { label: "Kritik", data: sirali.map(t => t.kritik), borderColor: "#e74c3c" },
                    { label: "Yüksek", data: sirali.map(t => t.yuksek), borderColor: "#e67e22" }
                ]
            },
            options: { maintainAspectRatio: false }
        });
    } catch (h) {
        document.getElementById("gecmisTablo").textContent = "Geçmiş alınamadı: " + h.message;
    }
}

async function kritikYukle() {
    const kutu = document.getElementById("kritikListe");
    try {
        const v = await getir("/api/olaylar/kritik");
        kutu.innerHTML = "";
        if (v.adet === 0) {
            kutu.textContent = "Kayıt yok";
            return;
        }
        v.olaylar.forEach(o => {
            const p = document.createElement("p");
            p.textContent = "[" + o.skor + "] " + o.aciklama + " | " + (o.kullanici || "-") + " | " + tarihKisalt(o.zaman);
            kutu.appendChild(p);
        });
    } catch (h) {
        kutu.textContent = "Kritik olaylar alınamadı: " + h.message;
    }
}

function aiKartiOlustur(y) {
    const kart = document.createElement("div");
    kart.className = "ai-kart";

    const baslik = document.createElement("strong");
    baslik.textContent = "[" + y.skor + "] " + y.aciklama + " (id: " + y.id + ")";
    kart.appendChild(baslik);

    const tehdit = document.createElement("p");
    tehdit.textContent = "Tehdit türü: " + (y.yorum.tehdit_turu || "-");
    kart.appendChild(tehdit);

    const ozet = document.createElement("p");
    ozet.textContent = y.yorum.ozet || "";
    kart.appendChild(ozet);

    if (y.yorum.aksiyonlar && y.yorum.aksiyonlar.length) {
        const liste = document.createElement("ul");
        y.yorum.aksiyonlar.forEach(a => {
            const li = document.createElement("li");
            li.textContent = a;
            liste.appendChild(li);
        });
        kart.appendChild(liste);
    }
    return kart;
}

async function taraCalistir() {
    const btn = document.getElementById("taraBtn");
    const aiSonuc = document.getElementById("aiSonuc");
    btn.disabled = true;
    aiSonuc.innerHTML = "";
    document.getElementById("aiBolum").style.display = "none";
    yaz("durum", "Tarama ve AI yorumu çalışıyor, 1-2 dakika sürebilir...");

    try {
        const veri = await getir("/api/tara", { method: "POST" });
        if (!veri.basarili) {
            yaz("durum", veri.hata);
            return;
        }
        yaz("durum", "Tamamlandı: " + veri.toplam + " olay tarandı.");
        veri.yorumlar.forEach(y => aiSonuc.appendChild(aiKartiOlustur(y)));
        document.getElementById("aiBolum").style.display = "block";

        await Promise.all([sonTaramaYukle(), gecmisYukle(), kritikYukle()]);
    } catch (h) {
        yaz("durum", "Hata: " + h.message);
    } finally {
        btn.disabled = false;
    }
}

sonTaramaYukle();
gecmisYukle();
kritikYukle();
</script>
</body>
</html>
